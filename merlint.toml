# merlint configuration for oi.
#
# The rules below are bypasses for issues that we've consciously decided not
# to address. Run `merlint --no-build` from the project root to see the
# residual list. Add a justification next to every new entry so future
# maintainers understand the trade-off.

# ---------------------------------------------------------------------------
# E605 — missing test file.
#
# Tier 1 + Tier 2 alcotest suites now cover lib/oi/{manifest_layer,
# manifest_build,manifest_registry,source_manifest,audit,provenance,keys,
# origin}.ml under test/oi/test_*.ml. The remaining lib modules don't
# have a unit-test partner yet — bypass while we work through Tier 3+
# and the cmdliner-glue layer (which is covered by the cram suite under
# test/, not by per-module alcotest).
[[rules]]
files = "**/*.ml"
exclude = ["E605"]

[[rules]]
files = "**/*.mli"
exclude = ["E605"]

# ---------------------------------------------------------------------------
# E920 — untested OCaml code in documentation.
#
# We don't run odoc/mdx as part of [dune test] yet. The OCaml fragments in
# our READMEs are explanatory, not executable, and wiring up
# `(mdx (files ...))` stanzas for each one would be a separate piece of
# infrastructure. Revisit once we want to enforce that doc snippets compile.
[[rules]]
files = "**/*.md"
exclude = ["E920"]

[[rules]]
files = "**/*.mli"
exclude = ["E920"]

# ---------------------------------------------------------------------------
# E300 — variant naming convention.
#
# The flagged `PlusEq` constructor is `OpamTypesBase.PlusEq` from the opam
# library; we can't rename it. The match in `lib/oi/solver.ml` reflects the
# upstream type.
[[rules]]
files = "lib/oi/solver.ml"
exclude = ["E300"]

# ---------------------------------------------------------------------------
# E350 — boolean blindness.
#
# `mk_args`, `run`, and `test_run` in `lib/cmd/build.ml` aggregate the
# cmdliner flag terms before threading them into a typed record. The
# boolean count comes from the CLI surface (`--refresh`, `--all`,
# `--archives-only`, `--skip-local`, `--locked`, …) — collapsing them into
# a record at this layer would just push the boolean labelling into the
# call site of cmdliner's `Term.(... $ ... $ ...)` composition without
# improving safety. Bypass these specific entries.
[[rules]]
files = "lib/cmd/build.ml"
exclude = ["E350"]

# ---------------------------------------------------------------------------
# E415 — missing pretty printer (`val pp` on type `t`).
#
# These records carry several dozen JSON-codec fields apiece. A meaningful
# `pp` would either reimplement the JSON encoder or stub out as a single
# `<manifest>` placeholder; both are worse than what callers do today
# (they print via `Jsont_bytesrw.encode_string`). Bypass on the four
# manifest .mli files.
[[rules]]
files = "lib/oi/manifest_layer.mli"
exclude = ["E415"]

[[rules]]
files = "lib/oi/manifest_build.mli"
exclude = ["E415"]

[[rules]]
files = "lib/oi/manifest_registry.mli"
exclude = ["E415"]

[[rules]]
files = "lib/oi/source_manifest.mli"
exclude = ["E415"]

# ---------------------------------------------------------------------------
# E005 / E205 — lib/cmd/makefile_export.ml.
#
# E005 (long function): the two long top-level bindings flagged are
# [build_node_sh] and [install_sh] — verbatim POSIX shell helper scripts
# embedded as string literals (data, not control flow). The actual
# rendering logic was decomposed into small helpers; only these two data
# blobs remain over the threshold and splitting a shell script across
# OCaml string fragments would hurt, not help, readability.
#
# E205 (prefer Fmt over Printf): this module emits Makefile text in which
# `@`, `$@` and `@echo` are pervasive. Fmt is Format-based and interprets
# `@` as pretty-printing directives, which would corrupt every recipe
# line. Printf is the deliberate, correct choice here.
[[rules]]
files = "lib/cmd/makefile_export.ml"
exclude = ["E005", "E205"]
