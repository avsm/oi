name: Build

on: [push, pull_request]

env:
  DUNE_CACHE_ROOT: ${{ github.workspace }}/.cache
  DUNE_CACHE_STORAGE_MODE: hardlink
  DUNE_CACHE: enabled

jobs:
  tests:
    name: Tests

    strategy:
      fail-fast: false
      matrix:
        operating-system: [macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.operating-system }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Restore Oi cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache
          key: oi-cache-${{ matrix.operating-system }}
          restore-keys: |
            oi-cache-${{ matrix.operating-system }}-

      - name: Bootstrap oi from latest release
        # The prebuilt [oi] is the bootstrap: it solves and installs the
        # project's own dependencies, then invokes [dune build] to compile
        # the PR/changeset from source. Nothing about the bootstrap binary
        # ends up in the build output.
        run: |
          mkdir -p "$HOME/.local/bin"
          case "${{ runner.os }}" in
            macOS) asset="oi-macos-arm64" ;;
            Linux) asset="oi-linux-$(uname -m)" ;;
            *) echo "unsupported: ${{ runner.os }}"; exit 1 ;;
          esac
          curl -fsSL -o "$HOME/.local/bin/oi" \
            "https://github.com/${{ github.repository }}/releases/latest/download/${asset}"
          chmod +x "$HOME/.local/bin/oi"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/oi" config

      - name: Sync project deps with bootstrap oi
        run: oi sync -v

      - name: Build the PR/changeset from source
        run: oi exec -- dune build --profile=release

      - name: Smoke-test the freshly-built oi
        run: ./_build/default/bin/main.exe config


