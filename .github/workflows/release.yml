name: Release binaries

on:
  workflow_dispatch:

jobs:
  linux:
    name: Linux static (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs-on: ubuntu-latest
          - arch: aarch64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v5

      - name: Build static oi inside alpine container
        run: |
          cat > Dockerfile.build <<'EOF'
          FROM ocaml/opam:alpine-3.23-ocaml-5.4 AS builder
          USER root
          RUN apk add --no-cache build-base m4 perl pkgconf git curl bash patch \
              gmp-dev sqlite-dev sqlite-static openssl-dev openssl-libs-static \
              zlib-dev zlib-static
          USER opam
          WORKDIR /home/opam/src
          COPY --chown=opam:opam . /home/opam/src
          ENV OPAMYES=true OPAMCONFIRMLEVEL=unsafe-yes
          RUN opam install -y --deps-only .
          RUN opam exec -- dune build --profile=static bin/main.exe
          USER root
          RUN strip _build/default/bin/main.exe \
              && install -m 0755 _build/default/bin/main.exe /oi
          FROM scratch
          COPY --from=builder /oi /oi
          EOF
          docker build -f Dockerfile.build -t oi-build:${{ matrix.arch }} .
          cid=$(docker create oi-build:${{ matrix.arch }})
          mkdir -p dist
          docker cp "$cid:/oi" dist/oi-linux-${{ matrix.arch }}
          docker rm "$cid"

      - uses: actions/upload-artifact@v4
        with:
          name: oi-linux-${{ matrix.arch }}
          path: dist/oi-linux-${{ matrix.arch }}
          if-no-files-found: error

  macos:
    name: macOS release (arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.4.1"

      - name: Build release oi
        run: |
          opam install -y --deps-only .
          opam exec -- dune build --profile=release bin/main.exe
          mkdir -p dist
          cp _build/default/bin/main.exe dist/oi-macos-arm64
          chmod 755 dist/oi-macos-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: oi-macos-arm64
          path: dist/oi-macos-arm64
          if-no-files-found: error
